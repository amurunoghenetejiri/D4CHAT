name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under android/app/build/outputs/apk"
            find android -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          cp "$APK" D4CHAT-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4CHAT-android
          path: D4CHAT-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "## D4CHAT Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **D4CHAT-android**, unzip, install the APK. Works fully offline." >> "$GITHUB_STEP_SUMMARY"
