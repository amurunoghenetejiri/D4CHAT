name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK path
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 \
            || yes | "$SDK/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null 2>&1 \
            || true

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Align native modules with Expo SDK
        run: |
          npx expo install react-native-safe-area-context react-native-screens expo-linear-gradient expo-status-bar --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install --clean
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Point Gradle at Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

      - name: Locate APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            find android -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"
          cp "$APK" D4CHAT-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: D4CHAT-android
          path: D4CHAT-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "## D4CHAT Android APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **D4CHAT-android**, install on phone. Fully offline." >> "$GITHUB_STEP_SUMMARY"
