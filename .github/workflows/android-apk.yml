name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK path
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 \
            || yes | "$SDK/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null 2>&1 \
            || true

      - name: Expand full UI sources
        run: |
          if [ -f scripts/src.zip.b64 ]; then
            python3 - <<'PY'
          import base64, zipfile, io
          from pathlib import Path
          data = base64.b64decode(Path("scripts/src.zip.b64").read_text())
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              z.extractall(".")
          print("extracted UI sources")
          PY
          fi

      - name: Generate icons from logo
        run: |
          pip install pillow -q
          python3 scripts/generate-icons.py
          ls -la assets/

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Align native modules
        run: npx expo install react-native-safe-area-context react-native-screens expo-linear-gradient expo-status-bar --fix

      - name: Prebuild Android
        run: npx expo prebuild --platform android --non-interactive --no-install --clean
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Point Gradle at SDK
        run: echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Sign release with debug key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("android/app/build.gradle", "android/app/build.gradle.kts"):
              p = Path(name)
              if not p.exists():
                  continue
              t = p.read_text()
              if "signingConfig signingConfigs.debug" in t:
                  print("already patched")
                  break
              t2 = re.sub(r"(release\s*\{)", r"\1\n            signingConfig signingConfigs.debug", t, count=1)
              p.write_text(t2)
              print("patched")
              break
          PY

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
          NODE_ENV: production

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D4CHAT-android
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
